[agents]
max_threads = 3
max_depth = 1
job_max_runtime_seconds = 1800

[features]
hooks = true

[shell_environment_policy]
inherit = "all"

[shell_environment_policy.set]
CONDA_DEFAULT_ENV = "BlueCrystal"
CONDA_PREFIX = "/home/luosh/miniconda3/envs/BlueCrystal"
CONDA_SHLVL = "1"
PATH = "/home/luosh/miniconda3/envs/BlueCrystal/bin:/home/luosh/miniconda3/condabin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"