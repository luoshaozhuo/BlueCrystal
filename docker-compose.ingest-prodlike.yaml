services:
  # ── Data services ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: whale-prodlike-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whale_ingest
      POSTGRES_USER: ${WHALE_INGEST_PRODLIKE_PG_USER:-whale}
      POSTGRES_PASSWORD: ${WHALE_INGEST_PRODLIKE_PG_PASSWORD:-whale}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WHALE_INGEST_PRODLIKE_PG_USER:-whale} -d whale_ingest"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: whale-prodlike-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: whale-prodlike-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Ingest runtime services ──────────────────────────────────────────
  ingest-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale-prodlike-api
    restart: "no"
    command: ["api"]
    ports:
      - "18000:8000"
    environment:
      # PostgreSQL runtime DB
      WHALE_INGEST_DATABASE_BACKEND: postgresql
      WHALE_INGEST_DATABASE_URL: postgresql+psycopg://${WHALE_INGEST_PRODLIKE_PG_USER:-whale}:${WHALE_INGEST_PRODLIKE_PG_PASSWORD:-whale}@postgres:5432/whale_ingest
      # Redis state cache
      WHALE_INGEST_STATE_CACHE_BACKEND: redis
      WHALE_INGEST_REDIS_URL: redis://redis:6379/0
      WHALE_INGEST_REDIS_STATE_HASH_KEY: whale:ingest:state
      WHALE_INGEST_STATION_ID: whale-prod
      # Kafka message publish
      WHALE_INGEST_MESSAGE_BACKEND: kafka
      WHALE_INGEST_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      WHALE_INGEST_KAFKA_TOPIC: whale.ingest.state
      WHALE_INGEST_KAFKA_ACKS: all
      WHALE_INGEST_KAFKA_RETRIES: "3"
      WHALE_INGEST_KAFKA_REQUEST_TIMEOUT_MS: "5000"
      WHALE_INGEST_KAFKA_KEY_STRATEGY: source_id
      WHALE_INGEST_ACCESS_POLICY_MODE: file-policy
      WHALE_INGEST_ACCESS_POLICY_FILE: /app/config/access_policy.prodlike.yaml
      WHALE_INGEST_AUDIT_JSONL_PATH: /audit/ingest-audit.jsonl
      WHALE_INGEST_HEARTBEAT_INTERVAL_SECONDS: ${WHALE_INGEST_HEARTBEAT_INTERVAL_SECONDS:-5}
      WHALE_INGEST_HEARTBEAT_TIMEOUT_SECONDS: ${WHALE_INGEST_HEARTBEAT_TIMEOUT_SECONDS:-15}
      WHALE_INGEST_LEASE_TTL_SECONDS: ${WHALE_INGEST_LEASE_TTL_SECONDS:-10}
      WHALE_INGEST_PULL_MAX_IN_FLIGHT: ${WHALE_INGEST_PULL_MAX_IN_FLIGHT:-8}
    volumes:
      - ./config/ingest/access_policy.prodlike.yaml:/app/config/access_policy.prodlike.yaml:ro
      - audit-data:/audit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ingest-worker-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale-prodlike-worker-a
    restart: "no"
    command: ["worker", "--runtime-mode", "dual_active_partitioned", "--node-key", "worker-a"]
    environment:
      WHALE_INGEST_DATABASE_BACKEND: postgresql
      WHALE_INGEST_DATABASE_URL: postgresql+psycopg://${WHALE_INGEST_PRODLIKE_PG_USER:-whale}:${WHALE_INGEST_PRODLIKE_PG_PASSWORD:-whale}@postgres:5432/whale_ingest
      WHALE_INGEST_STATE_CACHE_BACKEND: redis
      WHALE_INGEST_REDIS_URL: redis://redis:6379/0
      WHALE_INGEST_REDIS_STATE_HASH_KEY: whale:ingest:state
      WHALE_INGEST_STATION_ID: whale-prod
      WHALE_INGEST_AUDIT_JSONL_PATH: /audit/ingest-audit.jsonl
      WHALE_INGEST_WORKER_SUMMARY_PATH: /audit/ingest-worker-a-summary.json
      WHALE_INGEST_HEARTBEAT_INTERVAL_SECONDS: ${WHALE_INGEST_HEARTBEAT_INTERVAL_SECONDS:-5}
      WHALE_INGEST_HEARTBEAT_TIMEOUT_SECONDS: ${WHALE_INGEST_HEARTBEAT_TIMEOUT_SECONDS:-15}
      WHALE_INGEST_LEASE_TTL_SECONDS: ${WHALE_INGEST_LEASE_TTL_SECONDS:-10}
      WHALE_INGEST_PULL_MAX_IN_FLIGHT: ${WHALE_INGEST_PULL_MAX_IN_FLIGHT:-8}
    volumes:
      - audit-data:/audit
    depends_on:
      postgres:
        condition: service_healthy

  ingest-worker-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale-prodlike-worker-b
    restart: "no"
    command: ["worker", "--runtime-mode", "dual_active_partitioned", "--node-key", "worker-b"]
    environment:
      WHALE_INGEST_DATABASE_BACKEND: postgresql
      WHALE_INGEST_DATABASE_URL: postgresql+psycopg://${WHALE_INGEST_PRODLIKE_PG_USER:-whale}:${WHALE_INGEST_PRODLIKE_PG_PASSWORD:-whale}@postgres:5432/whale_ingest
      WHALE_INGEST_STATE_CACHE_BACKEND: redis
      WHALE_INGEST_REDIS_URL: redis://redis:6379/0
      WHALE_INGEST_REDIS_STATE_HASH_KEY: whale:ingest:state
      WHALE_INGEST_STATION_ID: whale-prod
      WHALE_INGEST_AUDIT_JSONL_PATH: /audit/ingest-audit.jsonl
      WHALE_INGEST_WORKER_SUMMARY_PATH: /audit/ingest-worker-b-summary.json
      WHALE_INGEST_HEARTBEAT_INTERVAL_SECONDS: ${WHALE_INGEST_HEARTBEAT_INTERVAL_SECONDS:-5}
      WHALE_INGEST_HEARTBEAT_TIMEOUT_SECONDS: ${WHALE_INGEST_HEARTBEAT_TIMEOUT_SECONDS:-15}
      WHALE_INGEST_LEASE_TTL_SECONDS: ${WHALE_INGEST_LEASE_TTL_SECONDS:-10}
      WHALE_INGEST_PULL_MAX_IN_FLIGHT: ${WHALE_INGEST_PULL_MAX_IN_FLIGHT:-8}
    volumes:
      - audit-data:/audit
    depends_on:
      postgres:
        condition: service_healthy

  # ── Audit JSONL volume (optional) ────────────────────────────────────
  audit-jsonl:
    image: busybox
    container_name: whale-prodlike-audit-jsonl
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - audit-data:/audit

volumes:
  pg-data:
  audit-data:
