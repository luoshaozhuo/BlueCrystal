<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECharts GL Debug</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b1220;
        color: #dcebff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #app {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 16px;
      }

      .panel {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        border: 1px solid rgba(140, 166, 193, 0.14);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(17, 27, 45, 0.96), rgba(9, 16, 28, 0.98));
        padding: 14px;
      }

      .title {
        font-size: 14px;
        font-weight: 600;
      }

      .subtitle {
        margin-top: 4px;
        color: #8ca6c1;
        font-size: 12px;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 12px;
        margin-top: 12px;
        color: #b8cee4;
        font-size: 12px;
      }

      #chart {
        width: 100%;
        height: calc(100% - 78px);
        min-height: 420px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="panel">
        <div class="title">ECharts GL Standalone Debug</div>
        <div class="subtitle">独立 HTML 入口，不走业务页面布局</div>
        <div class="meta">
          <div id="webgl">WebGL: pending</div>
          <div id="canvas">Canvas: pending</div>
          <div id="container">Container: pending</div>
          <div id="chart-status">Chart: pending</div>
        </div>
        <div id="chart"></div>
      </div>
    </div>
    <script type="module" src="/src/echarts-gl-debug.ts"></script>
  </body>
</html>
