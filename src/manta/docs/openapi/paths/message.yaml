paths:
  /api/message/list:
    post:
      tags:
        - Message
      operationId: queryMessageList
      summary: 获取消息列表
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '../showtime.openapi.yaml#/components/schemas/MessageListResponse'

  /api/message/read:
    post:
      tags:
        - Message
      operationId: setMessageStatus
      summary: 设置消息已读状态
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../showtime.openapi.yaml#/components/schemas/MessageStatus'
      responses:
        '200':
          description: 设置成功
          content:
            application/json:
              schema:
                $ref: '../showtime.openapi.yaml#/components/schemas/MessageReadResponse'
