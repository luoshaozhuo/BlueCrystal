components:
  schemas:
    TurbineBaseInfo:
      type: object
      required:
        - id
        - turbineType
        - modelName
        - lon
        - lat
        - height
      properties:
        id:
          type: string
          description: 风机编号
          example: '01'
        turbineType:
          type: string
          description: 风机型号
          example: 10MW
        modelName:
          type: string
          description: 对应模型名
          example: WT__10MW
        lon:
          type: number
          format: double
          description: 经度（WGS84）
          example: 112.374857
        lat:
          type: number
          format: double
          description: 纬度（WGS84）
          example: 37.952314
        height:
          type: number
          format: double
          description: 高程，单位 m
          example: 1177.55

    TurbineRealtimeStatus:
      type: object
      required:
        - id
        - timestamp
        - rotorSpeed
        - rotorAzimuth
        - pitch1
        - pitch2
        - pitch3
        - yawAngle
        - activePower
        - reactivePower
        - windSpeed
        - windDirection
      properties:
        id:
          type: string
          description: 风机编号
          example: '01'
        timestamp:
          type: string
          format: date-time
          description: 数据时间戳（UTC）
          example: '2026-03-05T08:30:00Z'
        rotorSpeed:
          type: number
          format: double
          description: 叶轮转速，单位 rpm
          example: 12.48
        rotorAzimuth:
          type: number
          format: double
          description: 叶轮方位角，单位 °
          example: 210.56
        pitch1:
          type: number
          format: double
          description: 桨叶 1 桨距角，单位 °
          example: 8.4
        pitch2:
          type: number
          format: double
          description: 桨叶 2 桨距角，单位 °
          example: 9.1
        pitch3:
          type: number
          format: double
          description: 桨叶 3 桨距角，单位 °
          example: 8.8
        yawAngle:
          type: number
          format: double
          description: 偏航角，单位 °
          example: 173.2
        activePower:
          type: number
          format: double
          description: 有功功率，单位 MW
          example: 6.324
        reactivePower:
          type: number
          format: double
          description: 无功功率，单位 MVar
          example: 0.422
        windSpeed:
          type: number
          format: double
          description: 风速，单位 m/s
          example: 7.53
        windDirection:
          type: number
          format: double
          description: 风向角，单位 °
          example: -4.2

    TurbineBaseInfoResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponseMeta'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TurbineBaseInfo'

    TurbineRealtimeStatusResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponseMeta'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TurbineRealtimeStatus'
