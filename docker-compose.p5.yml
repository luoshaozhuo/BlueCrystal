# docker-compose.p5.yml
#
# Whale P5 准生产依赖验证期 — 最小本地依赖服务编排。
# 仅用于本地 P5 集成测试环境，不是生产部署方案。
#
# 包含服务：
#   PostgreSQL 15  (端口 5432)  — model_asset 四表集成测试
#   Redis 7        (端口 16379) — serving_cache E2E
#   Redpanda       (端口 9092)  — Kafka API 兼容（speed_layer pipeline）
#   MinIO          (端口 9000)  — S3 raw_archive E2E
#   TDengine 3.x   (端口 6041)  — waveform / simulation_result / raw_index / standardized
#
# 使用方式：
#   docker compose -f docker-compose.p5.yml up -d
#   docker compose -f docker-compose.p5.yml down -v
#
# 或通过封装脚本：
#   bash scripts/start_whale_p5_dependencies.sh
#   bash scripts/stop_whale_p5_dependencies.sh

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: whale
      POSTGRES_PASSWORD: whale
      POSTGRES_DB: whale_test
    ports:
      - "5432:5432"
    volumes:
      - pg_p5_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whale -d whale_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9644/v1/status/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_p5_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  tdengine:
    image: tdengine/tdengine:3.3.6.0
    environment:
      TZ: UTC
    ports:
      - "6030:6030"
      - "6041:6041"
      - "6031:6031"
      - "6032:6032"
    volumes:
      - tdengine_p5_data:/var/lib/taos
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u root:taosdata -H 'Content-Type: text/plain' -d 'SELECT 1' http://localhost:6041/rest/sql || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  pg_p5_data:
  minio_p5_data:
  tdengine_p5_data:
