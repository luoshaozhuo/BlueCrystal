services:
  ingest-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale-ingest-runtime
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["api"]
    ports:
      - "18000:8000"
    environment:
      WHALE_INGEST_DATABASE_BACKEND: sqlite
      WHALE_INGEST_DB_PATH: /app/data/ingest/whale.ingest.db
      WHALE_INGEST_STATE_CACHE_BACKEND: redis
      WHALE_INGEST_REDIS_HOST: redis
      WHALE_INGEST_REDIS_PORT: "6379"
      WHALE_INGEST_REDIS_STATE_HASH_KEY: whale:ingest:state
      WHALE_INGEST_STATION_ID: whale-dev
      WHALE_INGEST_MESSAGE_BACKEND: relational_outbox
      WHALE_SHARED_DB_BACKEND: sqlite
      WHALE_SHARED_DB_PATH: /app/data/shared/whale.db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: whale-ingest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whale_ingest
      POSTGRES_USER: whale
      POSTGRES_PASSWORD: whale
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whale -d whale_ingest"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: whale-ingest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: whale-ingest-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
