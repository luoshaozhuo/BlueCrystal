[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluecrystal"
version = "0.1.0"
description = "智慧能源平台"
authors = [{ name = "LuoSZ" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "APScheduler>=3.11,<4.0",
    "alembic>=1.18,<2.0",
    "fastapi>=0.136,<1.0",
    "kafka-python>=2.0,<3.0",
    "opentelemetry-api>=1.44,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1.0",
    "opentelemetry-sdk>=1.44,<2.0",
    "pandas>=2.2.3,<3.0",
    "prometheus-client>=0.24,<1.0",
    "prometheus-fastapi-instrumentator>=7.1,<8.0",
    "pydantic>=2.13,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyYAML>=6.0,<7.0",
    "redis>=5.0,<8.0",
    "SQLAlchemy>=2.0,<3.0",
    "starlette>=0.50,<1.0",
    "structlog>=25.5,<27.0",
    "typer>=0.20,<1.0",
    "uvicorn>=0.48,<1.0",
    "zstandard>=0.25,<1.0",
]

[project.scripts]
starfish = "starfish.__main__:app"

[project.optional-dependencies]
dev = [
    "black>=26.0,<27.0",
    "fakeredis>=2.35,<3.0",
    "httpx>=0.28,<1.0",
    "mypy>=1.20,<2.0",
    "pandas-stubs>=2.2.3,<3.0",
    "pydocstyle>=6.3,<7.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=1.3,<2.0",
    "ruff>=0.15,<1.0",
    "testcontainers[kafka]>=4.13,<5.0",
    "types-PyYAML>=6.0,<7.0",
]
# IEC104 runtime 使用 GPLv3 的 c104 二进制扩展，仅在明确启用 Starfish
# IEC104 功能的环境安装，避免将许可与二进制依赖扩散到全部部署。
iec104 = [
    "c104==2.2.1",
]
# ADS server 本身仅使用标准库；pyads 是真实协议 client 验收依赖。
ads = [
    "pyads>=3.6,<4.0",
]
s3 = [
    "boto3>=1.35,<2.0",
]
tdengine = [
    "taos-ws-py>=0.4,<1.0",
]
flink = [
    "apache-flink>=2.0,<3.0",
]
pulsar = [
    "pulsar-client>=3.6,<4.0",
]
# L5 外部依赖完整套件 (P0 五大服务: Kafka+Redis+MinIO/S3+TDengine+PostgreSQL)
# 安装命令: pip install -e ".[dev,l5]"
# redis、kafka-python、psycopg 已在核心依赖中声明。
# TDengine 当前主要通过 REST API 通信，taos-ws-py 是可选增强 driver。
l5 = [
    "boto3>=1.35,<2.0",
]

[tool.setuptools.packages.find]
where = ["src", "abc"]

[tool.setuptools.package-data]
observability = ["config/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
# 排除 src/whale/：该子包已在 __init__.py 显式声明为 skeleton，
# 依赖尚未实现的 whale.models（见 src/whale/processing/__init__.py 、
# src/whale/aggregation/__init__.py），属于远期 roadmap / 非生产链路。
# 在 whale.models 真正实现、whale 重新接入生产路径前，保留在 mypy 检查范围
# 之外会反复暴露 import-not-found 噪音；恢复纳入时直接删除此 exclude 即可。
exclude = ['^src/whale/']
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: unit tests — 开发期验证，无外部依赖",
    "smoke: smoke tests — 最小冒烟验证",
    "regression: regression tests — 防止历史问题、关键链路或高风险行为回退",
    "integration: integration tests — 模块集成期或跨模块联调期验证",
    "e2e: end-to-end tests — 端到端全链路验证",
    "deployment: deployment tests — 部署入口、配置装配、health/ready、最小部署闭环",
    "performance: performance tests — 性能、容量、长稳等高成本验证集合",
    "starfish: tests for the starfish simulator/runtime tool layer",
    "l5: 准生产依赖验证期测试 (历史标签，语义等同准生产依赖验证期；需要真实 Kafka/TDengine/S3/Redis/PG)",
    "external: 需要外部依赖的测试 (真实硬件、外部服务、特殊环境)。在此脚本和 CI 入口中不作为 must-run，默认归入 NOT_RUN: MISSING_ENVIRONMENT。",
    "prodlike: 需要 production-like 环境 (docker-compose 或等效)。执行前必须确认 docker-compose 就绪；未就绪时归入 NOT_RUN: MISSING_ENVIRONMENT。",
    "environment_pending: 需要当前环境不可用的外部服务 (历史技术标签，等价于 external + NOT_RUN: MISSING_ENVIRONMENT)",
    "load: 负载测试 (不在常规 CI 执行，归入 NOT_RUN: TOO_EXPENSIVE_FOR_THIS_RUN)",
    "stress: 压力测试 (不在常规 CI 执行，归入 NOT_RUN: TOO_EXPENSIVE_FOR_THIS_RUN)",
    "slow: 需要 C native 二进制或长时间执行的测试",
    "requires_raw_socket: 需要 Linux raw sockets 的测试 (归入 NOT_RUN: MISSING_ENVIRONMENT 当无 CAP_NET_RAW)",
    "requires_cap_net_raw: 需要 CAP_NET_RAW capability 的测试 (归入 NOT_RUN: MISSING_ENVIRONMENT 当无此权限)",
    "requires_root_or_cap_net_raw: 需要 root 或 CAP_NET_RAW 的测试 (归入 NOT_RUN: MISSING_ENVIRONMENT 当无此权限)",
]
