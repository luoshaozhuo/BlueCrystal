[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whale"
version = "0.1.0"
description = "能源数据统一平台"
authors = [{ name = "Team Whale" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.11,<4.0",
    "alembic>=1.18,<2.0",
    "fastapi>=0.136,<1.0",
    "kafka-python>=2.0,<3.0",
    "pydantic>=2.13,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyYAML>=6.0,<7.0",
    "redis>=5.0,<8.0",
    "SQLAlchemy>=2.0,<3.0",
    "typer>=0.26,<1.0",
    "uvicorn>=0.48,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.3,<2.0",
    "testcontainers[kafka]>=4.13,<5.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: unit tests",
    "smoke: smoke tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "load: performance load tests (not run in regular CI)",
    "stress: performance and stress tests (not run in regular CI)",
    "slow: slow tests that require C native binaries or external services",
    "requires_raw_socket: tests requiring Linux raw sockets",
    "requires_cap_net_raw: tests requiring CAP_NET_RAW capability",
    "requires_root_or_cap_net_raw: tests requiring root or CAP_NET_RAW",
]
