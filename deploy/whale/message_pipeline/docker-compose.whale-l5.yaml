# Whale L5 外部依赖 Docker Compose 编排
# =============================================================================
# 用途: 为 Whale speed_layer→storage 完整 L5 端到端验证提供所需外部服务。
#   覆盖 P0 五大服务: Kafka + Redis + MinIO/S3 + TDengine + PostgreSQL。
#   Pulsar 和 Flink 作为 P1 可选项，不阻塞 P0 验证。
#
# 使用方式:
#   # 启动 P0 服务 (Kafka + Redis + MinIO + TDengine + PostgreSQL)
#   docker compose -f docker-compose.whale-l5.yaml up -d
#
#   # 启动全部服务 (含 Pulsar + Flink)
#   docker compose -f docker-compose.whale-l5.yaml --profile full up -d
#
#   # 停止并清理
#   docker compose -f docker-compose.whale-l5.yaml down -v
#
# 环境变量覆盖:
#   MINIO_ROOT_USER / MINIO_ROOT_PASSWORD  (默认 minioadmin / minioadmin)
#   TDENGINE_USER / TDENGINE_PASSWORD      (默认 root / taosdata)
#   POSTGRES_USER / POSTGRES_PASSWORD      (默认 whale / whale)
# =============================================================================

services:
  # ── P0: Kafka Broker ────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: whale-l5-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── P0: Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: whale-l5-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 宿主机已有 Redis 占用 16379，Docker Redis 使用 6380 避免冲突
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── P0: MinIO (S3-compatible Object Storage) ────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: whale-l5-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # S3 API endpoint
      - "9000:9000"
      # MinIO Console (Web UI)
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - minio-data:/data

  # MinIO 自动创建 bucket 的初始化容器
  minio-init:
    image: minio/mc:latest
    container_name: whale-l5-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/whale-raw-archive;
      mc mb --ignore-existing local/whale-l5-test;
      echo 'MinIO buckets created: whale-raw-archive, whale-l5-test';
      exit 0;
      "

  # ── P0: TDengine (时序数据库) ───────────────────────────────────────────
  tdengine:
    image: tdengine/tdengine:latest
    container_name: whale-l5-tdengine
    restart: unless-stopped
    ports:
      # taosAdapter REST API
      - "6041:6041"
      # Native TCP connection
      - "6030:6030"
    environment:
      TAOS_FIRST_EP: localhost:6030
      TAOS_SECOND_EP: localhost:6030
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "root:taosdata", "http://localhost:6041/rest/sql", "-d", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos

  # ── P0: PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: whale-l5-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whale_ingest
      POSTGRES_USER: ${POSTGRES_USER:-whale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whale}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whale} -d whale_ingest"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  # ── P1: Pulsar Broker (optional, profile "full") ────────────────────────
  pulsar:
    image: apachepulsar/pulsar:latest
    container_name: whale-l5-pulsar
    restart: "no"
    command: >
      /bin/bash -c "bin/apply-config-from-env.py conf/standalone.conf &&
      bin/pulsar standalone"
    ports:
      - "6650:6650"
      - "8080:8080"
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
      advertisedListeners: "internal:pulsar://pulsar:6650,external:pulsar://localhost:6650"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/clusters"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
      - full

  # ── P1: Flink JobManager (optional, profile "full") ─────────────────────
  flink-jobmanager:
    image: flink:latest
    container_name: whale-l5-flink-jobmanager
    restart: "no"
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - full

  flink-taskmanager:
    image: flink:latest
    container_name: whale-l5-flink-taskmanager
    restart: "no"
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager\ntaskmanager.numberOfTaskSlots: 2"
    profiles:
      - full

volumes:
  minio-data:
  tdengine-data:
  tdengine-log:
  pg-data:
