# a multi-database configuration.

[alembic]
script_location = %(here)s/alembic_multidb

prepend_sys_path = .

path_separator = os

# databases = engine1, engine2
databases = whale

[whale]
db_url_env = WHALE_DB_URL
target_metadata = whale.shared.persistence.base:Base
orm_modules = whale.shared.persistence.orm

[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
